<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<title>Blex Driver</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script>addEventListener("load",function(){if(typeof jsQR!=="function"){var s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js";document.head.appendChild(s)}})</script>
<style>
:root{
  color-scheme:light;
  --bg:#ffffff; --soft:#F3F5F9; --ink:#0E1016; --ink2:#5A6070; --line:rgba(14,16,22,.08);
  --acc:#1877F2; --acc-d:#0B3FB5; --ok:#1E9E5A; --err:#D93A4E; --shade:rgba(20,24,48,.16);
  --ease:cubic-bezier(.32,.72,0,1); --spring:cubic-bezier(.34,1.35,.64,1);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter","Segoe UI",system-ui,sans-serif;
  --top:env(safe-area-inset-top,0px); --bot:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--font);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
.logo{display:block;user-select:none;-webkit-user-drag:none}
.screen{position:fixed;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}

/* ---------- login ---------- */
#login{overflow:auto;padding:calc(var(--top) + 24px) 28px calc(var(--bot) + 24px);
  background:radial-gradient(70% 38% at 85% 0%,rgba(0,212,255,.16),transparent 70%),radial-gradient(60% 34% at 0% 100%,rgba(24,119,242,.10),transparent 70%),#fff}
.lw{margin:auto;width:100%;max-width:380px;display:flex;flex-direction:column}
.lw .logo{width:168px;height:auto;margin-bottom:44px;animation:rise .7s var(--ease) both}
.lw h1{font-size:34px;line-height:1.08;font-weight:800;letter-spacing:-1.1px}
.lw .sub{margin:10px 0 30px;font-size:16px;color:var(--ink2);letter-spacing:-.1px}
.f{display:flex;align-items:center;gap:12px;height:58px;padding:0 18px;border-radius:20px;background:var(--soft);box-shadow:inset 0 0 0 1.5px transparent;transition:box-shadow .2s,background .2s}
.f+.f{margin-top:12px}
.f:focus-within{background:#fff;box-shadow:inset 0 0 0 1.5px var(--acc),0 6px 18px -8px rgba(24,119,242,.45)}
.f svg{width:21px;height:21px;flex:none;color:var(--ink2)}
.f input{flex:1;min-width:0;border:0;background:none;outline:0;font-size:17px;letter-spacing:-.2px}
.f input::placeholder{color:#9AA0B2}
.eye{display:grid;place-items:center;padding:6px;color:var(--ink2)}
.cta{width:100%;height:58px;margin-top:22px;border-radius:20px;font-weight:650;font-size:17px;letter-spacing:-.2px;color:#fff;
  background:linear-gradient(180deg,#2E86F7,var(--acc-d));box-shadow:0 14px 28px -12px rgba(24,119,242,.7),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .25s var(--spring),opacity .2s}
.cta:active{transform:scale(.97)}.cta[disabled]{opacity:.6}
.err{min-height:22px;margin-top:14px;font-size:14px;color:var(--err);text-align:center}

/* ---------- app shell ---------- */
#app{background:var(--bg)}
.veil{position:absolute;left:0;right:0;top:0;height:calc(var(--top) + 118px);z-index:4;pointer-events:none;background:linear-gradient(rgba(255,255,255,.92),rgba(255,255,255,.55) 55%,rgba(255,255,255,0));-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);-webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent)}
#app[data-tab=scan] .veil{background:linear-gradient(rgba(0,0,0,.86),rgba(0,0,0,.5) 55%,rgba(0,0,0,0));-webkit-backdrop-filter:none;backdrop-filter:none}
.top{position:absolute;left:0;right:0;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:calc(var(--top) + 10px) 18px 8px;height:calc(var(--top) + 64px)}
.top .logo{position:absolute;left:50%;top:calc(var(--top) + 33px);transform:translate(-50%,-50%);height:31px;width:auto}
#app[data-tab=scan] .top .logo{filter:brightness(1.7) saturate(1.2) drop-shadow(0 0 6px rgba(0,0,0,.35))}
.glass-c{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:#fff;background:rgba(255,255,255,.16);-webkit-backdrop-filter:blur(18px) saturate(190%);backdrop-filter:blur(18px) saturate(190%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.34),inset 0 1.5px 0 rgba(255,255,255,.6),inset 0 -8px 12px -6px rgba(255,255,255,.12),0 10px 26px -10px rgba(0,0,0,.55);transition:transform .25s var(--spring),background .25s}
.glass-c:active{transform:scale(.92);background:rgba(255,255,255,.28)}
.glass-c svg{width:22px;height:22px}.menu-b svg{width:21px;height:21px}
#app[data-tab=people] .menu-b{color:var(--ink);background:rgba(14,16,22,.045);box-shadow:inset 0 0 0 1px rgba(14,16,22,.1),inset 0 1.5px 0 rgba(255,255,255,.95),inset 0 -8px 12px -6px rgba(14,16,22,.05),0 10px 24px -14px var(--shade)}
.page{position:absolute;inset:0;display:none;flex-direction:column}
.page.on{display:flex}

/* scan */
.cam{position:absolute;inset:0;overflow:hidden;background:#0d1322}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.frame{position:absolute;left:50%;top:45%;width:min(64%,250px);aspect-ratio:1;transform:translate(-50%,-50%);pointer-events:none}
.frame i{position:absolute;width:36px;height:36px;border:4px solid rgba(255,255,255,.96);transition:border-color .2s}
.frame i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0;border-top-left-radius:20px}
.frame i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0;border-top-right-radius:20px}
.frame i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0;border-bottom-left-radius:20px}
.frame i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0;border-bottom-right-radius:20px}
.frame.hit i{border-color:#37E08F}
.frame::after{content:"";position:absolute;left:10%;right:10%;top:8%;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,#7fd0ff,transparent);animation:sweep 2.6s ease-in-out infinite}
.hint{position:absolute;left:50%;bottom:calc(var(--bot) + 186px);transform:translateX(-50%);max-width:calc(100% - 28px);text-align:center;color:#fff;font-size:13.5px;font-weight:500;padding:9px 16px;border-radius:99px;
  background:rgba(14,18,34,.42);-webkit-backdrop-filter:blur(16px) saturate(160%);backdrop-filter:blur(16px) saturate(160%)}
.nocam{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:30px;text-align:center;color:#c4cdea}
.nocam svg{width:46px;height:46px;opacity:.7}.nocam p{font-size:14.5px;line-height:1.55;max-width:270px}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}.flash.go{animation:flash .35s ease-out}
.shutter{position:absolute;left:0;right:0;bottom:calc(var(--bot) + 84px);display:grid;grid-template-columns:1fr 80px 1fr;align-items:center;padding:0 24px;z-index:6}
#shot{grid-column:2}#upBtn{grid-column:1;justify-self:start}
#shot{width:80px;height:80px;border-radius:50%;padding:6px;background:rgba(255,255,255,.28);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:inset 0 0 0 2px rgba(255,255,255,.85),0 14px 30px -12px rgba(0,0,0,.5);transition:transform .2s var(--spring)}
#shot span{display:block;width:100%;height:100%;border-radius:50%;background:linear-gradient(180deg,#FBFBFD,#DCDFE6);box-shadow:inset 0 2px 2px rgba(255,255,255,.9),inset 0 -3px 6px rgba(80,90,120,.18),0 2px 8px rgba(0,0,0,.18);transition:transform .2s var(--spring)}
#shot:active{transform:scale(.94)}#shot:active span{transform:scale(.9)}
#shot.shake{animation:shake .4s}

/* customers */
#p-people{background:#fff;padding:calc(var(--top) + 70px) 18px 0;overflow-y:auto;scrollbar-width:none}#p-people::-webkit-scrollbar{display:none}
.ph{flex:none;padding:6px 4px 12px}
.stats{display:flex;align-items:center;gap:20px;margin:18px 0 6px;padding:18px 20px 18px 18px;border-radius:30px;background:linear-gradient(160deg,#F2F7FF,#fff 72%);
  box-shadow:inset 0 0 0 1px rgba(24,119,242,.13),0 22px 36px -26px rgba(24,119,242,.5)}
.ring{position:relative;width:112px;height:112px;flex:none}
.ring svg{display:block;width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}.ring .rb{stroke:#E4E9F3}
.ring .rd{stroke:#1E9E5A;transition:stroke-dasharray .8s var(--ease)}.ring .rc{stroke:#D93A4E;transition:stroke-dasharray .8s var(--ease),stroke-dashoffset .8s var(--ease)}
.rv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.rv b{font-size:27px;font-weight:800;letter-spacing:-1px;line-height:1}.rv span{margin-top:5px;font-size:12px;color:var(--ink2)}
.tiles{flex:1;min-width:0;display:flex;flex-direction:column}
.tile{display:flex;align-items:center;gap:10px;height:38px;font-size:14.5px}.tile+.tile{border-top:1px solid var(--line)}
.tile i{width:9px;height:9px;border-radius:50%;flex:none;background:var(--acc)}.tile.ok i{background:#1E9E5A}.tile.no i{background:#D93A4E}
.tile span{flex:1;color:var(--ink2)}.tile b{font-size:21px;font-weight:750;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.ph h1{font-size:32px;font-weight:800;letter-spacing:-1px}
.ph p{margin-top:4px;color:var(--ink2);font-size:15px}
.sr{margin-top:14px}.sr .f{height:48px;border-radius:16px}.sr .f svg{width:19px;height:19px}.sr input{font-size:16px}
.list{flex:none;padding:8px 0 calc(var(--bot) + 96px);display:flex;flex-direction:column;gap:10px;scrollbar-width:none}.list::-webkit-scrollbar{display:none}
.row{display:flex;align-items:center;gap:12px;background:#fff;border-radius:24px;padding:12px 14px 12px 12px;box-shadow:inset 0 0 0 1px var(--line),0 10px 24px -18px var(--shade);animation:rise .4s var(--ease) both}
.av{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:700;font-size:18px;background:linear-gradient(150deg,#3fd6ff,var(--acc) 55%,var(--acc-d))}
.meta{flex:1;min-width:0}.meta b{display:block;font-size:16px;font-weight:650;letter-spacing:-.2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta small{display:block;margin-top:2px;color:var(--ink2);font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.time{font-size:12.5px;color:var(--ink2);flex:none;font-variant-numeric:tabular-nums}
.call{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(24,119,242,.1);color:var(--acc);flex:none}.call svg{width:19px;height:19px}
.empty{margin:auto;text-align:center;color:var(--ink2);padding:30px 24px}.empty svg{width:54px;height:54px;opacity:.4;margin-bottom:12px}.empty p{font-size:15.5px;line-height:1.5}

/* ---- Liquid Glass tab bar (from the Blex file): flat thumb at rest, glass lens while pressed or dragged ---- */
.dock{--d-ink:#8A91A4;--ik-line:#11141C;--ik-fill:transparent;--d-bg:rgba(238,240,246,.8);--d-rim:rgba(14,16,22,.06);--d-shadow:0 8px 22px -10px var(--shade);
  --d-fill:rgba(255,255,255,.06);--d-hi:rgba(255,255,255,.98);--d-lo:rgba(255,255,255,.55);--d-in:rgba(10,20,50,.16);
  position:absolute;left:0;right:0;bottom:calc(var(--bot) + 12px);z-index:7;margin:0 auto;width:min(206px,calc(100% - 36px));height:52px}
.dk-bar{position:absolute;inset:0;border-radius:999px;background:var(--d-bg);-webkit-backdrop-filter:blur(26px) saturate(190%);backdrop-filter:blur(26px) saturate(190%);
  box-shadow:inset 0 0 0 1px var(--d-rim),inset 0 1.5px 0 rgba(255,255,255,.7),inset 0 -1px 0 rgba(0,0,0,.04),var(--d-shadow);touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer}
.dk-row{position:absolute;inset:0;display:flex;padding:0 5px;
  -webkit-mask-image:linear-gradient(90deg,#000 var(--ma,0px),rgba(0,0,0,var(--mi,1)) var(--ma,0px),rgba(0,0,0,var(--mi,1)) var(--mb,0px),#000 var(--mb,0px));
  mask-image:linear-gradient(90deg,#000 var(--ma,0px),rgba(0,0,0,var(--mi,1)) var(--ma,0px),rgba(0,0,0,var(--mi,1)) var(--mb,0px),#000 var(--mb,0px))}
.dock .item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:0;min-width:0;padding:0;font-size:10px;font-weight:600;letter-spacing:.1px;line-height:1;color:var(--d-ink);pointer-events:none;transition:color .18s;position:relative}
.dock .item .ic{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;transition:stroke .3s}
.dock .item .fa{transition:fill .3s}
.dock .item[aria-current=true]{color:var(--ik-line);font-weight:650}
.dock .item[aria-current=true] .ic{stroke:var(--ik-line)}
.dock .item[aria-current=true] .fa{fill:var(--ik-fill)}
.dk-lens{position:absolute;left:0;top:0;pointer-events:none;border-radius:999px;overflow:hidden;will-change:transform,width,height;
  box-shadow:0 calc(6px + 4px*var(--k,0)) calc(14px + 10px*var(--k,0)) calc(-8px + 6px*var(--k,0)) rgba(20,25,45,.22)}
.dk-lens .rest{display:none}
.dk-thumb{position:absolute;left:0;top:0;pointer-events:none;border-radius:999px;background:linear-gradient(180deg,#fff,rgba(255,255,255,.86));opacity:calc(1 - var(--k,0));
  box-shadow:0 6px 14px -8px rgba(20,25,45,.3),inset 0 0 0 1px rgba(14,16,22,.05);will-change:transform,width,height}
.dk-lens .glassf{position:absolute;inset:0;opacity:var(--k,0);background:var(--d-fill);-webkit-backdrop-filter:blur(2.5px) saturate(1.35) brightness(1.03);backdrop-filter:blur(2.5px) saturate(1.35) brightness(1.03);
  box-shadow:inset 0 2px 2px rgba(255,255,255,.7),inset 0 -4px 7px var(--d-in),inset 0 0 12px rgba(255,255,255,.10)}
.dk-lens .mag{position:absolute;left:0;top:0;display:flex;padding:0 5px;transform-origin:0 0;opacity:var(--k,0)}
.dk-lens::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;opacity:var(--k,0);
  background:linear-gradient(155deg,var(--d-hi),rgba(255,255,255,.08) 34%,rgba(255,255,255,0) 62%,var(--d-lo));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.bd{position:absolute;top:-5px;left:calc(50% + 8px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#11141C;color:#fff;font-size:10.5px;font-weight:700;display:none;place-items:center;box-shadow:0 0 0 2px #ECEFF6}
.bd.on{display:grid}
.dock .item .ic-w{position:relative;display:grid;place-items:center}

/* ---- side half-sheet ---- */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(10,14,30,.32);opacity:0;pointer-events:none;transition:opacity .35s}
.scrim.on{opacity:1;pointer-events:auto}
.side{position:fixed;top:0;bottom:0;left:0;width:min(78%,330px);z-index:41;background:#fff;border-radius:0 32px 32px 0;
  padding:calc(var(--top) + 18px) 20px calc(var(--bot) + 20px);display:flex;flex-direction:column;transform:translateX(-104%);transition:transform .5s var(--ease);
  box-shadow:inset 0 0 0 1px var(--line),0 0 60px -20px var(--shade);touch-action:pan-y;visibility:hidden}
.side.on{transform:none;visibility:visible}
.side-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.side-h .logo{height:28px;width:auto}
.x{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--soft)}.x svg{width:18px;height:18px}
.acct{display:flex;align-items:center;gap:12px;padding:14px;border-radius:22px;background:var(--soft)}
.acct .av{width:46px;height:46px}
.acct small{display:block;font-size:12.5px;color:var(--ink2)}.acct b{display:block;font-size:14.5px;font-weight:600;word-break:break-all;margin-top:2px}
.side .grow{flex:1}
.out{display:flex;align-items:center;gap:12px;width:100%;height:56px;padding:0 16px;border-radius:20px;color:var(--err);font-weight:650;font-size:16.5px;background:rgba(217,58,78,.08);transition:transform .25s var(--spring)}
.out:active{transform:scale(.97)}.out svg{width:22px;height:22px}

/* ---- result sheet ---- */
.dim{position:fixed;inset:0;background:rgba(10,14,30,.32);opacity:0;pointer-events:none;transition:opacity .3s;z-index:50}.dim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:8px;right:8px;bottom:calc(var(--bot) + 8px);z-index:51;max-width:520px;margin:0 auto;background:#fff;border-radius:34px;padding:12px 20px 20px;
  transform:translateY(125%);transition:transform .5s var(--ease);box-shadow:inset 0 0 0 1px var(--line),0 -10px 60px -20px var(--shade)}
.sheet.on{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:rgba(14,16,22,.14);margin:0 auto 16px}
.sheet h2{font-size:22px;font-weight:750;letter-spacing:-.5px;line-height:1.2}
.cust{display:flex;align-items:center;gap:12px;padding:12px;border-radius:22px;background:var(--soft);margin-bottom:18px}
.cust .av{width:44px;height:44px;font-size:17px}.cust .meta small{margin-top:3px}.cust .pr{flex:none;font-size:16px;font-weight:750;letter-spacing:-.3px;white-space:nowrap}
.sheet h2.q{margin:0 2px 16px}
.act{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:58px;border-radius:20px;font-size:16.5px;font-weight:650;letter-spacing:-.2px;color:#fff;transition:transform .25s var(--spring)}
.act:active{transform:scale(.97)}.act svg{width:22px;height:22px}
.act.good{background:#fff;color:var(--acc-d);box-shadow:inset 0 0 0 2px var(--acc),0 14px 28px -18px rgba(24,119,242,.65)}
.act.good svg{width:25px;height:25px}
.cancel-t{display:flex;align-items:center;justify-content:center;gap:4px;width:100%;margin-top:8px;padding:14px 8px 6px;color:var(--err);font-size:15.5px;font-weight:600;letter-spacing:-.2px}
.cancel-t svg{width:15px;height:15px;opacity:.8}
.sh-h{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.back{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--soft);flex:none}.back svg{width:18px;height:18px}
.opts-wrap{max-height:min(62vh,560px);overflow-y:auto;scrollbar-width:none;margin:0 -4px;padding:0 4px 6px}.opts-wrap::-webkit-scrollbar{display:none}
.gl{margin:18px 8px 8px;font-size:13px;font-weight:650;color:var(--ink2)}.gl:first-child{margin-top:2px}
.grp{background:var(--soft);border-radius:22px;overflow:hidden}
.opt{display:flex;align-items:center;gap:13px;width:100%;min-height:54px;padding:10px 16px;text-align:left;font-size:15.5px;font-weight:600;letter-spacing:-.2px;line-height:1.3;transition:background .2s}
.opt+.opt{box-shadow:inset 0 1px 0 var(--line)}.opt:active{background:#E8EBF2}
.opt span{flex:1}.opt svg{width:21px;height:21px;color:var(--ink2);flex:none}.opt svg.ch{width:15px;height:15px;opacity:.4}
.note{display:block;width:100%;min-height:112px;resize:none;border:0;outline:0;border-radius:20px;background:var(--soft);padding:16px;font:inherit;font-size:16px;line-height:1.45;box-shadow:inset 0 0 0 1.5px transparent;transition:box-shadow .2s,background .2s}
.note:focus{background:#fff;box-shadow:inset 0 0 0 1.5px var(--acc)}
.rt{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:none}
.chip{display:inline-block;font-size:11.5px;font-weight:650;padding:3px 9px;border-radius:99px}
.chip.ok{color:#14794A;background:rgba(30,158,90,.12)}.chip.no{color:#B42338;background:rgba(217,58,78,.12)}
.toast{position:fixed;left:50%;top:calc(var(--top) + 72px);transform:translate(-50%,-16px);opacity:0;z-index:60;pointer-events:none;max-width:88%;text-align:center;
  background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:inset 0 0 0 1px var(--line),0 14px 34px -14px var(--shade);
  padding:11px 18px;border-radius:99px;font-size:14px;font-weight:500;transition:all .35s var(--ease)}
.toast.on{opacity:1;transform:translate(-50%,0)}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sweepA{0%{top:-52px}100%{top:100%}}
.an{position:fixed;inset:0;z-index:48;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:rgba(8,12,26,.62);-webkit-backdrop-filter:blur(26px) saturate(150%);backdrop-filter:blur(26px) saturate(150%);opacity:0;pointer-events:none;transition:opacity .35s}
.an.on{opacity:1;pointer-events:auto}
.an-img{position:relative;width:min(74vw,290px);aspect-ratio:1;border-radius:32px;overflow:hidden;background:#111;box-shadow:0 0 0 2px rgba(255,255,255,.28),0 34px 60px -24px rgba(0,0,0,.7);transform:scale(.92);transition:transform .5s var(--spring)}
.an.on .an-img{transform:none}
.an-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(.9) brightness(.8)}
.an-img i{position:absolute;width:30px;height:30px;border:3.5px solid #fff;z-index:2}
.an-img i:nth-of-type(1){top:14px;left:14px;border-right:0;border-bottom:0;border-top-left-radius:14px}.an-img i:nth-of-type(2){top:14px;right:14px;border-left:0;border-bottom:0;border-top-right-radius:14px}
.an-img i:nth-of-type(3){bottom:14px;left:14px;border-right:0;border-top:0;border-bottom-left-radius:14px}.an-img i:nth-of-type(4){bottom:14px;right:14px;border-left:0;border-top:0;border-bottom-right-radius:14px}
.an-line{position:absolute;left:0;right:0;top:-52px;height:52px;z-index:1;background:linear-gradient(180deg,rgba(90,190,255,0),rgba(90,190,255,.5));border-bottom:2px solid #9BE0FF;box-shadow:0 8px 22px rgba(90,190,255,.55);animation:sweepA 1.5s ease-in-out infinite}
.an.done .an-line,.an.fail .an-line{display:none}
.an-res{position:absolute;left:50%;top:50%;width:88px;height:88px;margin:-44px 0 0 -44px;border-radius:50%;z-index:3;display:grid;place-items:center;transform:scale(.4);opacity:0;transition:transform .5s var(--spring),opacity .25s}
.an-res.show{transform:none;opacity:1}.an-res.ok{background:#1E9E5A;box-shadow:0 14px 30px -10px rgba(30,158,90,.8)}.an-res.bad{background:#D93A4E;box-shadow:0 14px 30px -10px rgba(217,58,78,.8)}
.an-res svg{width:42px;height:42px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.an-bar{width:min(74vw,290px);height:4px;border-radius:2px;background:rgba(255,255,255,.2);margin-top:26px;overflow:hidden}
.an-bar div{height:100%;width:0;border-radius:2px;background:linear-gradient(90deg,#5ac8ff,#fff)}
.an.done .an-bar div{background:#35d489}.an.fail .an-bar div{background:#ff6b7d}
.an-st{display:flex;align-items:center;gap:10px;margin-top:18px;color:#fff;font-size:17px;font-weight:650;letter-spacing:-.2px}
.an-spin{width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(255,255,255,.3);border-top-color:#fff;animation:spin .8s linear infinite}
.an.done .an-spin,.an.fail .an-spin{display:none}
.an-sub{margin-top:6px;min-height:20px;color:rgba(255,255,255,.72);font-size:14px;text-align:center;max-width:290px;line-height:1.4}
.an-btns{display:flex;flex-direction:column;gap:10px;margin-top:20px;width:min(74vw,290px)}
.an-b{height:52px;border-radius:18px;font-weight:650;font-size:16px;background:#fff;color:var(--ink)}.an-b.ghost{background:rgba(255,255,255,.14);color:#fff}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes sweep{0%,100%{top:8%;opacity:0}15%,85%{opacity:1}50%{top:88%}}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V6.5A2.5 2.5 0 0 1 6.5 4H8M16 4h1.5A2.5 2.5 0 0 1 20 6.5V8M20 16v1.5a2.5 2.5 0 0 1-2.5 2.5H16M8 20H6.5A2.5 2.5 0 0 1 4 17.5V16"/><rect class="fa" x="8" y="8" width="3.2" height="3.2" rx=".7"/><rect class="fa" x="12.8" y="8" width="3.2" height="3.2" rx=".7"/><rect class="fa" x="8" y="12.8" width="3.2" height="3.2" rx=".7"/><path d="M13.2 14.4h2.8v1.6"/></svg>
        Scan</button>

<!-- Side half-sheet -->

<script>
(function(){var l=document.querySelectorAll('img.logo');for(var i=1;i<l.length;i++)l[i].src=l[0].src})();
(function(){
  var $=function(i){return document.getElementById(i)};
  var scans=[], stream=null, pending=null, camOK=false, busy=false, tab='scan', barUI=null;

  /* ---------- login ---------- */
  var emailRe=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
  $('eye').onclick=function(){var p=$('pass');p.type=p.type==='password'?'text':'password'};
  function login(){
    var e=$('email').value.trim(), p=$('pass').value;
    if(!emailRe.test(e)){$('err').textContent='Enter a valid email address.';return}
    if(p.length<6){$('err').textContent='Password must be at least 6 characters.';return}
    $('err').textContent=''; $('go').disabled=true; $('go').textContent='Signing in…';
    setTimeout(function(){
      $('go').disabled=false; $('go').textContent='Sign in';
      $('who').textContent=e; $('avatar').textContent=e[0].toUpperCase();
      $('login').classList.remove('on'); $('app').classList.add('on');
      setTab('scan'); if(barUI) barUI.remeasure();
    },650);
  }
  $('go').onclick=login;
  ['email','pass'].forEach(function(i){$(i).addEventListener('keydown',function(ev){if(ev.key==='Enter')login()})});

  /* ---------- side sheet ---------- */
  function openSide(on){
    $('side').classList.toggle('on',on); $('scrim').classList.toggle('on',on); $('side').setAttribute('aria-hidden',!on);
  }
  $('menuBtn').onclick=function(){openSide(true)}; $('sideX').onclick=function(){openSide(false)}; $('scrim').onclick=function(){openSide(false)};
  $('out').onclick=function(){
    openSide(false); stopCam(); scans=[]; $('q').value=''; render(); $('pass').value='';
    setTimeout(function(){$('app').classList.remove('on'); $('login').classList.add('on')},280);
  };
  document.addEventListener('keydown',function(e){if(e.key==='Escape'){openSide(false);hideSheet()}});
  (function(){var s=$('side'),x0=null,dx=0;
    s.addEventListener('pointerdown',function(e){x0=e.clientX;dx=0});
    s.addEventListener('pointermove',function(e){if(x0===null)return;dx=Math.max(0,x0-e.clientX);if(dx>8){s.style.transition='none';s.style.transform='translateX('+(-dx)+'px)'}});
    var end=function(){if(x0===null)return;s.style.transition='';s.style.transform='';if(dx>90)openSide(false);x0=null};
    s.addEventListener('pointerup',end);s.addEventListener('pointercancel',end)})();

  /* ---------- tabs ---------- */
  function setTab(t){
    tab=t; $('app').dataset.tab=t;
    $('p-scan').classList.toggle('on',t==='scan'); $('p-people').classList.toggle('on',t==='people');
    if(barUI) barUI.sync(t);
    if(t==='scan') startCam(); else stopCam();
  }

  /* ---------- Liquid Glass tab bar (spring lens, ported from the Blex file) ---------- */
  barUI=(function(){
    var wrap=$('bar'),bar=$('dkBar'),row=$('dkRow'),lens=$('dkLens'),mag=$('dkMag');
    var thumb=document.createElement('div');thumb.className='dk-thumb';bar.insertBefore(thumb,row);
    var tabs=[].slice.call(row.querySelectorAll('.item'));
    mag.innerHTML=row.innerHTML;
    var magTabs=[].slice.call(mag.querySelectorAll('.item')); magTabs.forEach(function(b){b.tabIndex=-1;b.removeAttribute('data-tab')});
    var MAG=1.18, RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
    var W=0,H=0,tw=0,centers=[],selected=0,releaseT=0,running=false,last=performance.now();
    var St={x:0,vx:0,tx:0,k:0,vk:0,tk:0,drag:false,moved:false};
    function kick(){if(!running){running=true;last=performance.now();requestAnimationFrame(frame)}}
    function clampX(x){return Math.max(centers[0],Math.min(centers[centers.length-1],x))}
    function nearest(x){return centers.reduce(function(b,c,i){return Math.abs(c-x)<Math.abs(centers[b]-x)?i:b},0)}
    function localX(e){return e.clientX-wrap.getBoundingClientRect().left}
    function setActive(i){tabs.forEach(function(b,j){b.setAttribute('aria-current',j===i)});magTabs.forEach(function(b,j){b.setAttribute('aria-current',j===i)})}
    function measure(){
      var r=wrap.getBoundingClientRect(); W=r.width;H=r.height; if(!W) return;
      mag.style.width=W+'px';mag.style.height=H+'px';
      centers=tabs.map(function(t){var b=t.getBoundingClientRect();return b.left-r.left+b.width/2});
      tw=tabs[0].getBoundingClientRect().width;
    }
    bar.addEventListener('pointerdown',function(e){
      if(!e.isPrimary||!W)return; bar.setPointerCapture(e.pointerId);clearTimeout(releaseT);
      St.drag=true;St.moved=false;St.tk=1;St.tx=centers[nearest(localX(e))];setActive(nearest(St.tx));kick();
    });
    bar.addEventListener('pointermove',function(e){if(!St.drag)return;St.moved=true;St.tx=clampX(localX(e));setActive(nearest(St.tx));kick()});
    function end(e){
      if(!St.drag)return; St.drag=false;
      var i=e.type==='pointercancel'?selected:nearest(St.tx), tap=e.type==='pointerup';
      selected=i;setActive(i);St.tx=centers[i];kick();
      releaseT=setTimeout(function(){St.tk=0;kick()},St.moved?0:30);   /* a plain tap keeps the lens up for a beat */
      if(tap) setTimeout(function(){setTab(tabs[i].dataset.tab)},0);
    }
    bar.addEventListener('pointerup',end);bar.addEventListener('pointercancel',end);
    function frame(now){
      var dt=Math.min(.033,(now-last)/1000);last=now;
      if(RM||!W){St.x=St.tx;St.k=St.tk;St.vx=St.vk=0}
      else{
        var kx=1500,cx=St.drag?78:76,h=dt/2,tkE=Math.max(St.tk,Math.abs(St.x-St.tx)>6?1:0);   /* bigger while it travels */
        for(var n=0;n<2;n++){
          St.vx+=(-(St.x-St.tx)*kx-St.vx*cx)*h;St.x+=St.vx*h;
          St.vk+=(-(St.k-tkE)*1100-St.vk*64)*h;St.k+=St.vk*h}
      }
      var k=Math.max(0,Math.min(1.04,St.k)),kk=Math.min(1,k);
      var restW=tw-2,restH=H-6,lensW=tw+16,lensH=H+12;
      var sx=RM?0:Math.min(1,Math.abs(St.vx)/900)*20,lw=restW+(lensW-restW)*k+sx,lh=restH+(lensH-restH)*k-sx*.22,cy=H/2;
      lens.style.setProperty('--k',kk.toFixed(3));
      lens.style.width=lw+'px';lens.style.height=lh+'px';
      lens.style.transform='translate3d('+(St.x-lw/2)+'px,'+(cy-lh/2)+'px,0)';
      thumb.style.setProperty('--k',kk.toFixed(3));thumb.style.width=lw+'px';thumb.style.height=lh+'px';thumb.style.transform=lens.style.transform;
      var s=1+(MAG-1)*kk;
      mag.style.transform='translate('+(lw/2-s*St.x)+'px,'+(lh/2-s*cy)+'px) scale('+s+')';
      row.style.setProperty('--ma',(St.x-lw/2+4).toFixed(1)+'px');
      row.style.setProperty('--mb',(St.x+lw/2-4).toFixed(1)+'px');
      row.style.setProperty('--mi',(1-kk).toFixed(3));
      if(!St.drag&&Math.abs(St.x-St.tx)<.05&&Math.abs(St.vx)<.4&&Math.abs(St.k-St.tk)<.002&&Math.abs(St.vk)<.02){St.x=St.tx;St.k=St.tk;St.vx=St.vk=0;running=false;return}
      requestAnimationFrame(frame);
    }
    function sync(t){var i=Math.max(0,tabs.findIndex(function(b){return b.dataset.tab===t}));selected=i;setActive(i);
      if(!St.drag){clearTimeout(releaseT);St.tx=centers[i]||0;St.tk=0}kick()}
    function init(jump){measure();if(!centers.length)return;if(jump)St.x=St.tx=centers[selected];else St.tx=centers[selected];setActive(selected);kick()}
    addEventListener('resize',function(){init(true)});
    if(window.ResizeObserver) new ResizeObserver(function(){measure();if(centers.length){St.tx=centers[selected];if(!St.drag)St.x=St.tx;kick()}}).observe(wrap);
    if(document.fonts&&document.fonts.ready) document.fonts.ready.then(function(){init(true)});
    return{sync:sync,remeasure:function(){init(true)}};
  })();

  /* ---------- camera ---------- */
  var autoT=0, autoBusy=false, analyzing=false, coolUntil=0, lastDup='', lastDupT=0, curUrl='';
  function startCam(){
    if(stream) return;
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){noCam();return}
    navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280}},audio:false}).then(function(s){
      if(tab!=='scan'){s.getTracks().forEach(function(t){t.stop()});return}
      stream=s; camOK=true; var v=$('video'); v.srcObject=s; var p=v.play(); if(p&&p.catch) p.catch(function(){});
      $('nocam').style.display='none'; $('frame').style.display=''; $('hint').style.display=''; autoLoop();
    }).catch(noCam);
  }
  function noCam(err){
    camOK=false; var msg='Camera unavailable. Allow camera access, or upload a photo of the QR code with the button on the left.';
    if(err&&err.name==='NotAllowedError'&&window.self!==window.top) msg='The camera is blocked while the app is shown inside another page. Open the app directly in your browser, or upload a QR photo with the button on the left.';
    $('nocamMsg').textContent=msg; $('nocam').style.display='flex'; $('frame').style.display='none'; $('hint').style.display='none';
  }
  function stopCam(){ clearTimeout(autoT); if(stream){stream.getTracks().forEach(function(t){t.stop()}); stream=null} $('video').srcObject=null }

  /* ---------- decode (native BarcodeDetector first, jsQR as backup, several sizes) ---------- */
  var detector=null;
  try{ if('BarcodeDetector' in window) detector=new BarcodeDetector({formats:['qr_code']}) }catch(e){}
  function toCanvas(src,w,h,max){
    var k=Math.min(max/Math.max(w,h),3), iw=Math.max(1,Math.round(w*k)), ih=Math.max(1,Math.round(h*k));
    var pad=Math.max(32,Math.round(Math.max(iw,ih)*.12)), c=document.createElement('canvas');
    c.width=iw+pad*2; c.height=ih+pad*2;
    var x=c.getContext('2d',{willReadFrequently:true}); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(src,pad,pad,iw,ih);
    return {c:c,x:x};
  }
  function decodeOne(o){
    var js=function(){
      if(typeof jsQR!=='function') return null;
      var d=o.x.getImageData(0,0,o.c.width,o.c.height), r=jsQR(d.data,d.width,d.height,{inversionAttempts:'attemptBoth'});
      return r&&r.data?r.data:null;
    };
    if(detector) return detector.detect(o.c).then(function(r){return r.length&&r[0].rawValue?r[0].rawValue:js()}).catch(js);
    return Promise.resolve(js());
  }
  function decode(src,w,h,sizes){
    if(!detector&&typeof jsQR!=='function') return Promise.reject('noengine');
    sizes=sizes||[1600,1000,640]; var i=0;
    return (function next(){
      if(i>=sizes.length) return Promise.resolve(null);
      return decodeOne(toCanvas(src,w,h,sizes[i++])).then(function(t){return t||next()});
    })();
  }
  function clean(s){return String(s).replace(/E28094/g,'—').replace(/\s+/g,' ').trim()}
  function parse(text){
    var o={}, d=null;
    try{ d=JSON.parse(text) }catch(e){}
    if(d&&typeof d==='object'){
      var pick=function(keys){for(var i=0;i<keys.length;i++){if(d[keys[i]]) return clean(d[keys[i]])}return ''};
      o.name=pick(['name','customer','client','full_name']);
      o.phone=pick(['phone','tel','mobile']);
      o.address=pick(['address','city','wilaya']);
      o.product=pick(['product','item']);
      o.price=pick(['price','total','amount']);
      o.code=pick(['id','order','order_id','code','ref'])||clean(text).slice(0,24);
    }else if(text.indexOf('|')>-1&&text.split('|').length>=4){
      var p=text.split('|').map(clean);          /* BRAND | ORDER | NAME | PHONE | WILAYA | PRICE | SIZE */
      o.code=p[1]||p[0]; o.name=p[2]||''; o.phone=p[3]||''; o.address=p[4]||''; o.price=p[5]||'';
      o.product=[p[0],p[6]?'Size '+p[6]:''].filter(Boolean).join(' · ');
    }else{ o.code=clean(text).slice(0,60) }
    if(!o.name) o.name='Order '+o.code;
    return o;
  }

  /* ---------- live auto-scan ---------- */
  function autoLoop(){
    clearTimeout(autoT);
    if(!stream||tab!=='scan') return;
    autoT=setTimeout(function(){
      var v=$('video');
      if(autoBusy||busy||pending||analyzing||Date.now()<coolUntil||!v.videoWidth){autoLoop();return}
      autoBusy=true;
      decode(v,v.videoWidth,v.videoHeight,[720]).then(function(t){autoBusy=false; if(t&&!pending&&!analyzing) found(t,true)})
        .catch(function(){autoBusy=false}).then(autoLoop);
    },320);
  }

  /* ---------- capture ---------- */
  function ping(ok){
    $('flash').classList.remove('go'); void $('flash').offsetWidth; $('flash').classList.add('go');
    $('frame').classList.toggle('hit',!!ok);
    if(ok&&navigator.vibrate) try{navigator.vibrate(40)}catch(e){}
    setTimeout(function(){$('frame').classList.remove('hit')},900);
  }
  function miss(e){var b=$('shot'); b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake');
    toast(e==='noengine'?'The QR reader could not load. Check your connection.':'No QR code found. Move closer and try again.')}
  function found(text,auto){
    var o=parse(text);
    if(scans.some(function(s){return s.code===o.code})){
      if(!auto||lastDup!==o.code||Date.now()-lastDupT>4000) toast('This order is already scanned.');
      lastDup=o.code; lastDupT=Date.now(); coolUntil=Date.now()+1500; return;
    }
    ping(true); pending=o; showSheet();
  }
  $('shot').onclick=function(){
    if(busy||analyzing) return;
    if(!camOK||!stream){ $('file').click(); return }
    var v=$('video'); if(!v.videoWidth){toast('Camera is starting, try again in a moment.');return}
    busy=true; ping(false);
    decode(v,v.videoWidth,v.videoHeight,[1280,720]).then(function(t){busy=false; t?found(t):miss()}).catch(function(e){busy=false;miss(e)});
  };
  $('upBtn').onclick=function(){ if(!analyzing) $('fileUp').click() };
  $('file').onchange=$('fileUp').onchange=function(){ var f=this.files&&this.files[0]; this.value=''; if(f) analyze(f) };

  /* ---------- photo analysis ---------- */
  var icoOk='<svg viewBox="0 0 24 24"><path d="m6 12.5 4 4L18 8"/></svg>', icoNo='<svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7 7 17"/></svg>';
  function setSt(t,s){$('anTxt').textContent=t;$('anSub').textContent=s||''}
  function closeAn(){ $('an').className='an'; analyzing=false; coolUntil=Date.now()+800; setTimeout(function(){if(curUrl&&!analyzing){URL.revokeObjectURL(curUrl);curUrl=''}},500) }
  function analyze(file){
    analyzing=true; if(curUrl) URL.revokeObjectURL(curUrl);
    var url=curUrl=URL.createObjectURL(file), an=$('an'), fill=$('anFill'), timers=[];
    $('anPic').src=url; $('anBtns').textContent=''; $('anRes').className='an-res'; $('anRes').textContent='';
    an.className='an on'; setSt('Reading image…','');
    fill.style.transition='none'; fill.style.width='0%'; void fill.offsetWidth; fill.style.transition='width 1.9s cubic-bezier(.3,.6,.2,1)'; fill.style.width='90%';
    timers.push(setTimeout(function(){setSt('Looking for the QR code…','')},650), setTimeout(function(){setSt('Reading order data…','')},1250));
    var img=new Image();
    var dec=new Promise(function(res,rej){
      img.onload=function(){decode(img,img.naturalWidth,img.naturalHeight).then(res,rej)};
      img.onerror=function(){rej('badimg')}; img.src=url;
    }).then(function(t){return {t:t}},function(e){return {e:e}});
    var wait=new Promise(function(r){setTimeout(r,1900)});
    Promise.all([dec,wait]).then(function(r){
      timers.forEach(clearTimeout); r=r[0];
      if(r.t){
        fill.style.transition='width .3s'; fill.style.width='100%'; an.classList.add('done');
        $('anRes').innerHTML=icoOk; $('anRes').className='an-res ok show'; setSt('QR code detected','Preparing the order…');
        setTimeout(function(){closeAn(); found(r.t)},950);
      }else{
        an.classList.add('fail'); $('anRes').innerHTML=icoNo; $('anRes').className='an-res bad show'; fill.style.width='100%';
        var m=r.e==='noengine'?['The QR reader could not load','Check your connection and try again.']
             :r.e==='badimg'?['This file can’t be read','Choose a photo or a screenshot.']
             :['No QR code found','Make sure the whole code is visible and sharp.'];
        setSt(m[0],m[1]);
        var a=el('button','an-b','Choose another image'); a.type='button'; a.onclick=function(){closeAn(); $('fileUp').click()};
        var b=el('button','an-b ghost','Close'); b.type='button'; b.onclick=closeAn;
        $('anBtns').append(a,b);
      }
    });
  }

  /* ---------- result sheet: delivered or cancelled ---------- */
  var S='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">';
  var icoCheck=S.replace('1.8','2.4')+'<path d="m5 12.5 4.5 4.5L19 7.5"/></svg>', icoX=S.replace('1.8','2.4')+'<path d="M6 6l12 12M18 6 6 18"/></svg>',
      icoBack=S.replace('1.8','2.2')+'<path d="m15 5-7 7 7 7"/></svg>', icoChev=S.replace('<svg','<svg class="ch"').replace('1.8','2.2')+'<path d="m9 5 7 7-7 7"/></svg>',
      icoClock=S+'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>', icoBox=S+'<path d="M12 3 4 7v10l8 4 8-4V7Z"/><path d="m4 7 8 4 8-4M12 11v10"/></svg>',
      icoWarn=S+'<path d="M12 4 3 19h18Z"/><path d="M12 10v4M12 16.6v.1"/></svg>', icoPen=S+'<path d="M4 20h4L19 9a2.1 2.1 0 0 0-3-3L5 17Z"/><path d="m14 7 3 3"/></svg>';
  function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
  function setBody(nodes){var b=$('shBody');b.textContent='';nodes.forEach(function(n){b.append(n)})}
  function head(title,backFn){var h=el('div','sh-h'),b=el('button','back');b.type='button';b.setAttribute('aria-label','Back');b.innerHTML=icoBack;b.onclick=backFn;h.append(b,el('h2',null,title));return h}
  var icoCheckC='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#1877F2"/><path d="m7 12.5 3.2 3.2L17 9" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  function ic(p){return S+p+'</svg>'}
  var GROUPS=[
    ['Time and delivery',[
      ['Delivery took too long','<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>'],
      ['Customer unavailable or not answering','<path d="M5 4h3.5l1.5 4-2 1.5a11 11 0 0 0 6.5 6.5L16 14l4 1.5V19a2 2 0 0 1-2 2A15 15 0 0 1 3 6a2 2 0 0 1 2-2Z"/>'],
      ['Wrong address or location not found','<path d="M12 21s6.5-5.6 6.5-11a6.5 6.5 0 0 0-13 0C5.5 15.4 12 21 12 21Z"/><circle cx="12" cy="10" r="2.3"/>'],
      ['Customer asked to reschedule','<rect x="4" y="5.5" width="16" height="14.5" rx="3"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/>']]],
    ['Product',[
      ['Customer changed their mind','<path d="M4 12a8 8 0 1 0 2.6-5.9"/><path d="M4 4v4.5h4.5"/>'],
      ['Wrong product delivered','<path d="M12 3 4 7v10l8 4 8-4V7Z"/><path d="m4 7 8 4 8-4M12 11v10"/>'],
      ['Product damaged or defective','<path d="M12 4 3 19h18Z"/><path d="M12 10v4M12 16.6v.1"/>'],
      ['Not as described or pictured','<rect x="3.5" y="5" width="17" height="14" rx="3"/><circle cx="9" cy="10" r="1.5"/><path d="m4 17 5-4.5 4 3.5 3-2.5 4 3.5"/>'],
      ['Wrong size, color or variant','<path d="M3.5 12.2V5.5a2 2 0 0 1 2-2h6.7l8.3 8.3a2 2 0 0 1 0 2.8l-6.4 6.4a2 2 0 0 1-2.8 0Z"/><circle cx="8.5" cy="8.5" r="1.2"/>'],
      ['Missing items, order incomplete','<path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/>']]],
    ['Payment',[
      ['Customer can’t pay at delivery','<rect x="3" y="6.5" width="18" height="11" rx="3"/><circle cx="12" cy="12" r="2.5"/>'],
      ['Price differs from the listing','<path d="M7 8h13l-3-3M17 16H4l3 3"/>'],
      ['Delivery fee refused','<path d="M6 3.5h12v17l-3-2-3 2-3-2-3 2Z"/><path d="M9 8.5h6M9 12h6"/>']]],
    ['Other',[
      ['Ordered by mistake or duplicate order','<rect x="8.5" y="8.5" width="11.5" height="11.5" rx="3"/><path d="M15.5 8.5V6.5a3 3 0 0 0-3-3h-6a3 3 0 0 0-3 3v6a3 3 0 0 0 3 3h2"/>'],
      ['Fake or prank order','<path d="M5 21V4"/><path d="M5 5h11l-2 3.5 2 3.5H5"/>'],
      ['Customer refused without a reason','<circle cx="12" cy="12" r="8.5"/><path d="m6 6 12 12"/>'],
      ['Something else','<path d="M4 20h4L19 9a2.1 2.1 0 0 0-3-3L5 17Z"/><path d="m14 7 3 3"/>',1]]]
  ];
  function viewAsk(){
    var o=pending,c=el('div','cust'),m=el('div','meta');
    m.append(el('b',null,o.name),el('small',null,(o.product?o.product+' · ':'')+'Order '+o.code));
    var loc=[o.address,o.phone].filter(Boolean).join(' · '); if(loc) m.append(el('small',null,loc));
    c.append(el('div','av',(o.name.trim()[0]||'?').toUpperCase()),m); if(o.price) c.append(el('div','pr',o.price));
    var g=el('button','act good');g.type='button';g.innerHTML=icoCheckC;g.append('Order completed successfully');g.onclick=function(){finish('delivered','')};
    var r=el('button','cancel-t');r.type='button';r.append('Customer cancelled the order');r.insertAdjacentHTML('beforeend',icoChev);r.onclick=viewReasons;
    setBody([c,el('h2','q','Did the customer receive the product?'),g,r]);
  }
  function viewReasons(){
    var wrap=el('div','opts-wrap');
    GROUPS.forEach(function(g){
      wrap.append(el('div','gl',g[0]));
      var card=el('div','grp');
      g[1].forEach(function(r){
        var b=el('button','opt');b.type='button';b.innerHTML=ic(r[1]);b.append(el('span',null,r[0]));b.insertAdjacentHTML('beforeend',icoChev);
        b.onclick=function(){r[2]?viewOther():finish('cancelled',r[0])};card.append(b)});
      wrap.append(card)});
    setBody([head('Why was it cancelled?',viewAsk),wrap]);
  }
  function viewOther(){
    var t=el('textarea','note');t.placeholder='Write the reason…';t.maxLength=300;t.setAttribute('aria-label','Reason');
    var s=el('button','cta','Send');s.type='button';s.disabled=true;s.style.marginTop='12px';
    t.oninput=function(){s.disabled=!t.value.trim()};
    s.onclick=function(){var v=t.value.trim();if(v)finish('cancelled',v)};
    setBody([head('Something else',viewReasons),t,s]);
    setTimeout(function(){t.focus()},380);
  }
  function showSheet(){viewAsk();$('dim').classList.add('on');$('sheet').classList.add('on')}
  function hideSheet(){$('dim').classList.remove('on');$('sheet').classList.remove('on');pending=null;coolUntil=Date.now()+2500}
  $('dim').onclick=hideSheet;
  function finish(status,reason){
    var p=pending;if(!p)return;
    p.status=status;p.reason=reason;p.time=new Date();scans.unshift(p);hideSheet();render();
    toast(status==='delivered'?'Order completed':'Cancellation sent');
  }

  /* ---------- customers list ---------- */
  function fmt(d){return d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}
  function render(){
    var q=$('q').value.trim().toLowerCase(), box=$('list'); box.textContent='';
    var n=scans.length;
    document.querySelectorAll('[data-bd]').forEach(function(b){b.textContent=n;b.classList.toggle('on',n>0)});
    var dn=scans.filter(function(s){return s.status==='delivered'}).length, cn=n-dn, C=263.9, a=n?dn/n*C:0, bb=n?cn/n*C:0;
    $('rd').setAttribute('stroke-dasharray',a.toFixed(1)+' '+C); $('rc').setAttribute('stroke-dasharray',bb.toFixed(1)+' '+C); $('rc').setAttribute('stroke-dashoffset',(-a).toFixed(1));
    $('rate').textContent=n?Math.round(dn/n*100)+'%':'—'; $('stN').textContent=n; $('stD').textContent=dn; $('stC').textContent=cn;
    $('count').textContent=new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});
    var items=scans.filter(function(s){return !q||(s.name+' '+s.code+' '+s.phone).toLowerCase().indexOf(q)>-1});
    if(!items.length){
      var e=document.createElement('div'); e.className='empty';
      e.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.2A6.5 6.5 0 0 1 21.5 20"/></svg>';
      var p=document.createElement('p'); p.textContent=n?'No customers match your search.':'Scan a product’s QR code and its customer will appear here.'; e.append(p); box.append(e); return;
    }
    items.forEach(function(s,i){
      var r=document.createElement('div'); r.className='row'; r.style.animationDelay=(i*30)+'ms';
      var a=document.createElement('div'); a.className='av'; a.textContent=(s.name.trim()[0]||'?').toUpperCase();
      var m=document.createElement('div'); m.className='meta';
      var b=document.createElement('b'); b.textContent=s.name;
      var sm=document.createElement('small'); sm.textContent=s.status==='cancelled'?(s.reason||'Cancelled'):(s.product||s.address||('Order '+s.code));
      m.append(b,sm);
      var t=document.createElement('div'); t.className='rt';
      var tm=document.createElement('span'); tm.className='time'; tm.textContent=fmt(s.time);
      var ch=document.createElement('span'); ch.className='chip '+(s.status==='delivered'?'ok':'no'); ch.textContent=s.status==='delivered'?'Delivered':'Cancelled';
      t.append(tm,ch); r.append(a,m,t);
      var ph=(s.phone||'').replace(/[^\d+]/g,'');
      if(ph){var c=document.createElement('a'); c.className='call'; c.href='tel:'+ph; c.setAttribute('aria-label','Call '+s.name);
        c.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h3.5l1.5 4-2 1.5a11 11 0 0 0 6.5 6.5L16 14l4 1.5V19a2 2 0 0 1-2 2A15 15 0 0 1 3 6a2 2 0 0 1 2-2Z"/></svg>'; r.append(c)}
      box.append(r);
    });
  }
  $('q').oninput=render;

  var tt; function toast(m){var t=$('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(tt); tt=setTimeout(function(){t.classList.remove('on')},2400)}
  render();
})();
</script>
